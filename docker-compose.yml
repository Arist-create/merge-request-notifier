version: '3.8'

services:
  gitlab-merge-monitor:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: gitlab-merge-monitor
    restart: unless-stopped
    env_file:
      - .env
    environment:
      - PYTHONUNBUFFERED=1

  jira-done-checker:
    build:
      context: .
      dockerfile: Dockerfile.jira
    container_name: jira-done-checker
    restart: unless-stopped
    env_file:
      - .env
    environment:
      - PYTHONUNBUFFERED=1
